<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBITBREAK — a radial ricochet defence</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050812;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    touch-action: none;
    cursor: crosshair;
  }
</style>
</head>
<body>
  <canvas id="game" width="1280" height="720" aria-label="ORBITBREAK game"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
